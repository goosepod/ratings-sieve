[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratings-sieve"
version = "0.3.0"
description = "Opt-in Navidrome preference filtering for AudioMuse similarity"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4"]

[tool.setuptools.packages.find]
include = ["ratings_sieve*"]
